version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Match the Node.js the apps run on (.nvmrc, 24.x): newer type
      # majors describe APIs the runtime doesn't have.
      - dependency-name: "@types/node"
        versions: [">=25"]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directories:
      - "/services/pkg"
      - "/services/proto"
      - "/services/gateway"
      - "/services/media"
      - "/services/payments"
      - "/services/content"
      - "/services/listings"
      - "/services/trails"
      - "/services/users"
      - "/services/bot"
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - "/services/gateway"
      - "/services/media"
      - "/services/payments"
      - "/services/content"
      - "/services/listings"
      - "/services/trails"
      - "/services/users"
      - "/services/bot"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
