name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [pkg, gateway, media]
    defaults:
      run:
        working-directory: services/${{ matrix.module }}
    env:
      # Same as the Docker builds: pure-Go WebP codec, no dlopen.
      GOFLAGS: -tags=nodynamic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.module }}/go.mod
          cache-dependency-path: services/${{ matrix.module }}/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.2
          working-directory: services/${{ matrix.module }}

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...
