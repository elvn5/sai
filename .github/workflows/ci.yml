name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [pkg, proto, gateway, media, content, listings, users]
    defaults:
      run:
        working-directory: services/${{ matrix.module }}
    env:
      # Same as the Docker builds: pure-Go WebP codec, no dlopen.
      GOFLAGS: -tags=nodynamic
      # Database-backed tests create throwaway databases on this server.
      TEST_POSTGRES_DSN: host=localhost port=5432 user=test password=test dbname=postgres
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.module }}/go.mod
          cache-dependency-path: services/${{ matrix.module }}/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.2
          working-directory: services/${{ matrix.module }}

      - name: Test
        run: go test -race ./...

      # GOWORK=off, as in the Docker builds: each module must build on its own
      # (its go.mod must list everything pkg/proto pull in).
      - name: Build
        run: GOWORK=off go build ./...

  proto:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/proto
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/proto/go.mod
          cache-dependency-path: services/proto/go.sum

      - name: Lint protos
        run: go run github.com/bufbuild/buf/cmd/buf@v1.57.2 lint

      - name: Generated code is up to date
        run: |
          go run github.com/bufbuild/buf/cmd/buf@v1.57.2 generate
          git diff --exit-code -- gen
