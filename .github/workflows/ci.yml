name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Angular apps of the frontend migration: templates (Biome lints the TS
      # above) and unit tests (Vitest).
      - name: Lint Angular templates
        run: pnpm --filter @app/panel lint

      - name: Test Angular apps
        run: pnpm --filter @app/panel test

      - name: Build
        run: pnpm build

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        module: [pkg, proto, gateway, media, content, listings, users, trails, payments, bot]
    defaults:
      run:
        working-directory: services/${{ matrix.module }}
    env:
      # Same as the Docker builds: pure-Go WebP codec, no dlopen.
      GOFLAGS: -tags=nodynamic
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - "127.0.0.1::5432"
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/${{ matrix.module }}/go.mod
          cache-dependency-path: services/${{ matrix.module }}/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: services/${{ matrix.module }}

      - name: Test
        env:
          TEST_POSTGRES_DSN: host=127.0.0.1 port=${{ job.services.postgres.ports['5432'] }} user=test password=test dbname=postgres
        run: go test -race ./...

      # GOWORK=off, as in the Docker builds: each module must build on its own
      # (its go.mod must list everything pkg/proto pull in).
      - name: Build
        run: GOWORK=off go build ./...

  proto:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: services/proto
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/proto/go.mod
          cache-dependency-path: services/proto/go.sum

      - name: Lint protos
        run: go run github.com/bufbuild/buf/cmd/buf@v1.57.2 lint

      - name: Generated code is up to date
        run: |
          go run github.com/bufbuild/buf/cmd/buf@v1.57.2 generate
          git diff --exit-code -- gen
