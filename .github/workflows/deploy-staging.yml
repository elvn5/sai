name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
          - service: bot
            dockerfile: apps/bot/Dockerfile
          - service: admin
            dockerfile: apps/admin/Dockerfile
          - service: tourism
            dockerfile: apps/tourism/Dockerfile
          - service: gateway
            dockerfile: services/gateway/Dockerfile
          - service: media
            dockerfile: services/media/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ermekten-${{ matrix.service }}:staging
            ghcr.io/${{ github.repository_owner }}/ermekten-${{ matrix.service }}:staging-${{ github.sha }}
          build-args: |
            NUXT_PUBLIC_API_BASE_URL=${{ vars.NUXT_PUBLIC_API_BASE_URL }}
            NUXT_PUBLIC_SITE_URL=${{ vars.NUXT_PUBLIC_SITE_URL }}
            NUXT_PUBLIC_TELEGRAM_BOT_USERNAME=${{ vars.NUXT_PUBLIC_TELEGRAM_BOT_USERNAME }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ vars.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: docker-compose.deploy.yml
          target: ${{ vars.DEPLOY_PATH }}
          strip_components: 0

      - name: Write .env, deploy and migrate
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: staging
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_PORT: ${{ vars.POSTGRES_PORT }}
          API_PORT: ${{ vars.API_PORT }}
          ADMIN_PORT: ${{ vars.ADMIN_PORT }}
          CLIENT_PORT: ${{ vars.CLIENT_PORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          ADMIN_ORIGIN: ${{ vars.ADMIN_ORIGIN }}
          CLIENT_ORIGIN: ${{ vars.CLIENT_ORIGIN }}
          NUXT_PUBLIC_API_BASE_URL: ${{ vars.NUXT_PUBLIC_API_BASE_URL }}
          NUXT_PUBLIC_SITE_URL: ${{ vars.NUXT_PUBLIC_SITE_URL }}
          NUXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${{ vars.NUXT_PUBLIC_TELEGRAM_BOT_USERNAME }}
          MINI_APP_URL: ${{ vars.NUXT_PUBLIC_SITE_URL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ vars.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_OWNER,IMAGE_TAG,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,POSTGRES_PORT,API_PORT,ADMIN_PORT,CLIENT_PORT,JWT_SECRET,JWT_EXPIRES_IN,ADMIN_PASSWORD,BOT_TOKEN,RESEND_API_KEY,EMAIL_FROM,R2_ACCOUNT_ID,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_BUCKET_NAME,R2_PUBLIC_URL,ADMIN_ORIGIN,CLIENT_ORIGIN,NUXT_PUBLIC_API_BASE_URL,NUXT_PUBLIC_SITE_URL,NUXT_PUBLIC_TELEGRAM_BOT_USERNAME,MINI_APP_URL
          script: |
            set -euo pipefail
            mkdir -p "${{ vars.DEPLOY_PATH }}"
            cd "${{ vars.DEPLOY_PATH }}"

            umask 077
            cat > .env <<EOF
            IMAGE_OWNER=$IMAGE_OWNER
            IMAGE_TAG=$IMAGE_TAG
            POSTGRES_USER=$POSTGRES_USER
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            POSTGRES_DB=$POSTGRES_DB
            POSTGRES_PORT=$POSTGRES_PORT
            API_PORT=$API_PORT
            ADMIN_PORT=$ADMIN_PORT
            CLIENT_PORT=$CLIENT_PORT
            JWT_SECRET=$JWT_SECRET
            JWT_EXPIRES_IN=$JWT_EXPIRES_IN
            ADMIN_PASSWORD=$ADMIN_PASSWORD
            BOT_TOKEN=$BOT_TOKEN
            RESEND_API_KEY=$RESEND_API_KEY
            EMAIL_FROM=$EMAIL_FROM
            R2_ACCOUNT_ID=$R2_ACCOUNT_ID
            R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY
            R2_BUCKET_NAME=$R2_BUCKET_NAME
            R2_PUBLIC_URL=$R2_PUBLIC_URL
            ADMIN_ORIGIN=$ADMIN_ORIGIN
            CLIENT_ORIGIN=$CLIENT_ORIGIN
            NUXT_PUBLIC_API_BASE_URL=$NUXT_PUBLIC_API_BASE_URL
            NUXT_PUBLIC_SITE_URL=$NUXT_PUBLIC_SITE_URL
            NUXT_PUBLIC_TELEGRAM_BOT_USERNAME=$NUXT_PUBLIC_TELEGRAM_BOT_USERNAME
            MINI_APP_URL=$MINI_APP_URL
            EOF
            chmod 600 .env

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            docker compose -p ermekten-staging -f docker-compose.deploy.yml --env-file .env pull
            docker compose -p ermekten-staging -f docker-compose.deploy.yml --env-file .env up -d --remove-orphans
            docker compose -p ermekten-staging -f docker-compose.deploy.yml --env-file .env exec -T -w /repo/packages/database api \
              ./node_modules/.bin/typeorm migration:run -d dist/data-source.js
            docker compose -p ermekten-staging -f docker-compose.deploy.yml --env-file .env exec -T -w /repo/apps/api api \
              node dist/scripts/convert-uploads-to-webp.js
            docker image prune -f
