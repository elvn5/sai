name: Deploy

# Стратегия окружений:
#   push/merge в main   -> сборка образов -> деплой на STAGING (test.*)
#   push тега vX.Y.Z     -> сборка образов -> деплой на PRODUCTION
# Оба окружения живут на ОДНОМ сервере, но полностью изолированы:
#   - разные каталоги деплоя  (/opt/acme  vs  /opt/acme-staging)
#   - разные compose-проекты  (acme       vs  acme-staging)
#     => отдельные тома БД, сети и контейнеры
#   - разные порты на 127.0.0.1 (nginx на хосте проксирует нужные домены)
# Секреты и переменные задаются через GitHub Environments (staging, production).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Окружение для ручного деплоя"
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # 1. Определяем окружение, теги образов, каталог/проект/порты деплоя
  # --------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.vars.outputs.channel }}
      version: ${{ steps.vars.outputs.version }}
      deploy_tag: ${{ steps.vars.outputs.deploy_tag }}
      deploy_dir: ${{ steps.vars.outputs.deploy_dir }}
      project: ${{ steps.vars.outputs.project }}
      api_port: ${{ steps.vars.outputs.api_port }}
      admin_port: ${{ steps.vars.outputs.admin_port }}
      client_port: ${{ steps.vars.outputs.client_port }}
    steps:
      - id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            CH="${{ github.event.inputs.environment }}"
            VER="manual-${GITHUB_SHA::7}"
            DTAG="$CH"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            CH="production"
            VER="${GITHUB_REF_NAME#v}"
            DTAG="$VER"
          else
            CH="staging"
            VER="sha-${GITHUB_SHA::7}"
            DTAG="staging"
          fi

          # Каталог деплоя, имя compose-проекта и порты зависят от окружения.
          if [[ "$CH" == "production" ]]; then
            DDIR="/opt/acme";         PROJ="acme"
            AP=3001; ADP=3000; CP=3002
          else
            DDIR="/opt/acme-staging"; PROJ="acme-staging"
            AP=4001; ADP=4000; CP=4002
          fi

          {
            echo "channel=$CH"
            echo "version=$VER"
            echo "deploy_tag=$DTAG"
            echo "deploy_dir=$DDIR"
            echo "project=$PROJ"
            echo "api_port=$AP"
            echo "admin_port=$ADP"
            echo "client_port=$CP"
          } >> "$GITHUB_OUTPUT"
          echo "Окружение=$CH version=$VER deploy_tag=$DTAG dir=$DDIR proj=$PROJ ports=$AP/$ADP/$CP"

  # --------------------------------------------------------------------------
  # 2. Сборка и публикация образов всех приложений в GHCR
  #    environment: подтягивает переменные нужного окружения, чтобы
  #    NUXT_PUBLIC_API_BASE_URL (вшивается в client/admin на этапе сборки)
  #    указывал на правильный домен API для staging/production.
  # --------------------------------------------------------------------------
  build:
    needs: prepare
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.channel }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, bot, admin, client]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ needs.prepare.outputs.channel }}
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ needs.prepare.outputs.version }}
          build-args: |
            NUXT_PUBLIC_API_BASE_URL=${{ vars.NUXT_PUBLIC_API_BASE_URL }}
            NUXT_PUBLIC_BOT_URL=${{ vars.NUXT_PUBLIC_BOT_URL }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # --------------------------------------------------------------------------
  # 3. Деплой на сервер по SSH (docker compose pull && up -d)
  #    environment подтягивает секреты нужного окружения (и, при желании,
  #    правило ручного подтверждения для production).
  # --------------------------------------------------------------------------
  deploy:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: ${{ needs.prepare.outputs.channel }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Generate .env from GitHub secrets
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          NUXT_PUBLIC_API_BASE_URL: ${{ vars.NUXT_PUBLIC_API_BASE_URL }}
          NUXT_PUBLIC_BOT_URL: ${{ vars.NUXT_PUBLIC_BOT_URL }}
        run: |
          # обязательные — падаем сразу, если секрет забыли завести
          : "${JWT_SECRET:?JWT_SECRET secret is missing}"
          : "${ADMIN_PASSWORD:?ADMIN_PASSWORD secret is missing}"
          : "${BOT_TOKEN:?BOT_TOKEN secret is missing}"
          : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD secret is missing}"
          {
            printf 'POSTGRES_USER=%s\n'            "${POSTGRES_USER:-parcel_bot}"
            printf 'POSTGRES_PASSWORD=%s\n'        "$POSTGRES_PASSWORD"
            printf 'POSTGRES_DB=%s\n'              "${POSTGRES_DB:-parcel_bot}"
            printf 'JWT_SECRET=%s\n'               "$JWT_SECRET"
            [ -n "$JWT_EXPIRES_IN" ] && printf 'JWT_EXPIRES_IN=%s\n' "$JWT_EXPIRES_IN"
            printf 'ADMIN_PASSWORD=%s\n'           "$ADMIN_PASSWORD"
            printf 'BOT_TOKEN=%s\n'                "$BOT_TOKEN"
            [ -n "$CORS_ORIGINS" ] && printf 'CORS_ORIGINS=%s\n' "$CORS_ORIGINS"
            printf 'NUXT_PUBLIC_API_BASE_URL=%s\n' "$NUXT_PUBLIC_API_BASE_URL"
            printf 'NUXT_PUBLIC_BOT_URL=%s\n'      "$NUXT_PUBLIC_BOT_URL"
          } > .env
          chmod 644 .env   # scp-action Docker-контейнер должен прочитать файл

      - name: Ensure deploy dir exists
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_DIR: ${{ needs.prepare.outputs.deploy_dir }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          envs: DEPLOY_DIR
          script: |
            set -e
            mkdir -p "$DEPLOY_DIR"

      - name: Copy compose + release script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          source: "docker-compose.deploy.yml,deploy.sh,.env"
          target: ${{ needs.prepare.outputs.deploy_dir }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.deploy_tag }}
          COMPOSE_PROJECT_NAME: ${{ needs.prepare.outputs.project }}
          DEPLOY_DIR: ${{ needs.prepare.outputs.deploy_dir }}
          API_PORT: ${{ needs.prepare.outputs.api_port }}
          ADMIN_PORT: ${{ needs.prepare.outputs.admin_port }}
          CLIENT_PORT: ${{ needs.prepare.outputs.client_port }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          envs: IMAGE_TAG,COMPOSE_PROJECT_NAME,DEPLOY_DIR,API_PORT,ADMIN_PORT,CLIENT_PORT,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd "$DEPLOY_DIR"
            chmod +x deploy.sh
            ./deploy.sh
