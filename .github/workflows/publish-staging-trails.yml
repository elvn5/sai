name: Publish reviewed staging trails

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-staging-trails
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - name: Publish and verify the reviewed route posts
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: python3 scripts/publish-staging-trails.py
