<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Ermekten</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#991b1b">
  <meta property="og:site_name" content="Ermekten">
  <link id="favicon" rel="icon" type="image/svg+xml" href="/logo.svg">
  <!-- Dark mode and color theme before the first paint (no flash); see
       core/theme/color-mode.ts. -->
  <script>
    try {
      var root = document.documentElement;
      var mode = localStorage.getItem('nuxt-color-mode');
      if (mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        root.classList.add('dark');
      }
      if (localStorage.getItem('color-theme') === 'azure') {
        root.setAttribute('data-color-theme', 'azure');
        document.getElementById('favicon').href = '/logo-azure.svg';
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
