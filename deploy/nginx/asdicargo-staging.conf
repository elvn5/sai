# AsDi Cargo — STAGING (test.*) reverse proxy.
# Ставится на сервер: /etc/nginx/conf.d/asdicargo-staging.conf
# Порты соответствуют staging compose-проекту (asdicargo-staging):
#   client 4002, admin 4000, api 4001 (все на 127.0.0.1).
# Полностью самодостаточен — не зависит от наличия proxy_params.
# После правки: nginx -t && systemctl reload nginx
# TLS-строки (443/redirect) допишет certbot --nginx для этих доменов.

# --- CLIENT: test.asdicargo.com -> 127.0.0.1:4002 ---
server {
    listen 80;
    listen [::]:80;
    server_name test.asdicargo.com;

    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# --- ADMIN: test.admin.asdicargo.com -> 127.0.0.1:4000 ---
server {
    listen 80;
    listen [::]:80;
    server_name test.admin.asdicargo.com;

    client_max_body_size 25m;   # загрузка картинок в tiptap

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# --- API: test.api.asdicargo.com -> 127.0.0.1:4001 ---
server {
    listen 80;
    listen [::]:80;
    server_name test.api.asdicargo.com;

    client_max_body_size 25m;   # аплоады через API

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;   # socket.io / websockets
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
    }
}
