services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-api:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      UPLOADS_DIR: /repo/apps/api/uploads
    ports:
      - "${API_PORT}:3001"
    volumes:
      - uploads_data:/repo/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-bot:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-admin:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${ADMIN_PORT}:3000"
    depends_on:
      - api

  client:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-client:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${CLIENT_PORT}:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads_data:
