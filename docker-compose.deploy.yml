services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-api:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      UPLOADS_DIR: /repo/apps/api/uploads
      API_PORT: 3001
    # Internal only — the gateway owns the public API port and proxies
    # every endpoint not yet migrated to a Go service here.
    volumes:
      - uploads_data:/repo/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-gateway:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      LEGACY_API_URL: http://api:3001
      ADMIN_ORIGIN: ${ADMIN_ORIGIN}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      # nginx on the host reaches the gateway through the Docker bridge.
      TRUSTED_PROXIES: 172.16.0.0/12
    ports:
      - "${API_PORT}:8080"
    depends_on:
      - api

  bot:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-bot:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MINI_APP_URL: ${MINI_APP_URL}
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-admin:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${ADMIN_PORT}:3000"
    depends_on:
      - gateway

  tourism:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-tourism:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${CLIENT_PORT}:3000"
    depends_on:
      - gateway

volumes:
  postgres_data:
  uploads_data:
