services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  users:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-users:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      COOKIE_SECURE: "true"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      BOT_TOKEN: ${BOT_TOKEN}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM}
      # Links in password reset messages.
      SITE_URL: ${PUBLIC_SITE_URL}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      USERS_DB_NAME: users
      # One-time copy of accounts and support contacts from the NestJS database on first start.
      LEGACY_DB_NAME: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  media:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-media:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      UPLOADS_DIR: /data/uploads
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      USERS_GRPC_ADDR: users:9083
    # Same volume as the NestJS API: existing files stay where they are.
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      - users

  content:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-content:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CONTENT_DB_NAME: content
      # One-time copy of existing content from the NestJS database on first start.
      LEGACY_DB_NAME: ${POSTGRES_DB}
      MEDIA_GRPC_ADDR: media:9081
      USERS_GRPC_ADDR: users:9083
    depends_on:
      postgres:
        condition: service_healthy
      media:
        condition: service_started
      users:
        condition: service_started

  listings:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-listings:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LISTINGS_DB_NAME: listings
      # One-time copy of existing listings from the NestJS database on first start.
      LEGACY_DB_NAME: ${POSTGRES_DB}
      USERS_GRPC_ADDR: users:9083
      BOT_TOKEN: ${BOT_TOKEN}
      SITE_URL: ${PUBLIC_SITE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      users:
        condition: service_started

  trails:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-trails:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TRAILS_DB_NAME: trails
      USERS_GRPC_ADDR: users:9083
    depends_on:
      postgres:
        condition: service_healthy
      users:
        condition: service_started

  payments:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-payments:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PAYMENTS_DB_NAME: payments
      USERS_GRPC_ADDR: users:9083
      LISTINGS_GRPC_ADDR: listings:9082
      # "fake" (test page, no money moves) until Bakai access is set up.
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-off}
      BAKAI_LOGIN: ${BAKAI_LOGIN:-}
      BAKAI_PASSWORD: ${BAKAI_PASSWORD:-}
      BAKAI_QR_TYPE: ${BAKAI_QR_TYPE:-}
      # GoPay (PAYMENTS_PROVIDER=gopay): Test keys on staging, Live keys in
      # production; the webhook secret signs /payments/gopay/events.
      GOPAY_API_URL: ${GOPAY_API_URL:-https://api.gopay.kg}
      GOPAY_API_KEY: ${GOPAY_API_KEY:-}
      GOPAY_SECRET_KEY: ${GOPAY_SECRET_KEY:-}
      GOPAY_WEBHOOK_SECRET: ${GOPAY_WEBHOOK_SECRET:-}
      PLATFORM_FEE_PERCENT: ${PLATFORM_FEE_PERCENT:-0}
      SITE_URL: ${PUBLIC_SITE_URL}
      BOT_TOKEN: ${BOT_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      users:
        condition: service_started
      listings:
        condition: service_started

  gateway:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-gateway:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      MEDIA_URL: http://media:8081
      CONTENT_URL: http://content:8082
      LISTINGS_URL: http://listings:8083
      USERS_URL: http://users:8084
      TRAILS_URL: http://trails:8085
      PAYMENTS_URL: http://payments:8086
      ADMIN_ORIGIN: ${ADMIN_ORIGIN}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      # nginx on the host reaches the gateway through the Docker bridge.
      TRUSTED_PROXIES: 172.16.0.0/12
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${API_PORT}:8080"
    depends_on:
      - media
      - content
      - listings
      - users
      - trails
      - payments

  bot:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-bot:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      MINI_APP_URL: ${MINI_APP_URL}
      # Accounts and support contacts come from the users service.
      USERS_GRPC_ADDR: users:9083
      # Tours and the blog: the gateway, called on users' behalf
      # with sessions signed with JWT_SECRET.
      API_URL: http://gateway:8080
      JWT_SECRET: ${JWT_SECRET}
      # Cover pictures Telegram fetches itself.
      PUBLIC_API_URL: ${PUBLIC_API_BASE_URL}
      # Its own database: blog subscribers.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BOT_DB_NAME: bot
      # Analytics (GA4 Measurement Protocol); unset — off.
      FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID:-}
      GA_API_SECRET: ${GA_API_SECRET:-}
      ANALYTICS_SALT: ${ANALYTICS_SALT:-}
    depends_on:
      postgres:
        condition: service_healthy
      users:
        condition: service_started
      gateway:
        condition: service_started

  # The public site (SSR) and the admin panel, on the ports nginx proxies
  # to (CLIENT_PORT, ADMIN_PORT).
  site:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-site:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      API_BASE_URL: ${PUBLIC_API_BASE_URL}
      # Server-side rendering calls the gateway over the Docker network.
      API_INTERNAL_URL: http://gateway:8080
      SITE_URL: ${PUBLIC_SITE_URL}
      TELEGRAM_BOT_USERNAME: ${PUBLIC_TELEGRAM_BOT_USERNAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      # Shown in the footer: the deployed image's tag.
      APP_VERSION: ${IMAGE_TAG}
      DEV_MENU_PASSWORD_HASH: ${DEV_MENU_PASSWORD_HASH:-}
      # Firebase Analytics in the browser; unset — off.
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_WEB_APP_ID: ${FIREBASE_WEB_APP_ID:-}
      FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CLIENT_PORT}:3000"
    depends_on:
      - gateway

  panel:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-panel:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      API_BASE_URL: ${PUBLIC_API_BASE_URL}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ADMIN_PORT}:3000"
    depends_on:
      - gateway

volumes:
  postgres_data:
  uploads_data:
