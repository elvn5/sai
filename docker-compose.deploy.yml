services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-api:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      UPLOADS_DIR: /repo/apps/api/uploads
      API_PORT: 3001
    # Internal only — the gateway owns the public API port and proxies
    # every endpoint not yet migrated to a Go service here.
    volumes:
      - uploads_data:/repo/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy

  users:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-users:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Accounts stay in the NestJS database until stage 4 moves them.
      USERS_DB_NAME: ${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  media:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-media:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      UPLOADS_DIR: /data/uploads
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      USERS_GRPC_ADDR: users:9083
    # Same volume as the NestJS API: existing files stay where they are.
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      - users

  content:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-content:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CONTENT_DB_NAME: content
      # One-time copy of existing content from the NestJS database on first start.
      LEGACY_DB_NAME: ${POSTGRES_DB}
      MEDIA_GRPC_ADDR: media:9081
      USERS_GRPC_ADDR: users:9083
    depends_on:
      postgres:
        condition: service_healthy
      media:
        condition: service_started
      users:
        condition: service_started

  listings:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-listings:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LISTINGS_DB_NAME: listings
      # One-time copy of existing listings from the NestJS database on first start.
      LEGACY_DB_NAME: ${POSTGRES_DB}
      USERS_GRPC_ADDR: users:9083
    depends_on:
      postgres:
        condition: service_healthy
      users:
        condition: service_started

  gateway:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-gateway:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      LEGACY_API_URL: http://api:3001
      MEDIA_URL: http://media:8081
      CONTENT_URL: http://content:8082
      LISTINGS_URL: http://listings:8083
      ADMIN_ORIGIN: ${ADMIN_ORIGIN}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      # nginx on the host reaches the gateway through the Docker bridge.
      TRUSTED_PROXIES: 172.16.0.0/12
    ports:
      - "${API_PORT}:8080"
    depends_on:
      - api
      - media
      - content
      - listings

  bot:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-bot:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MINI_APP_URL: ${MINI_APP_URL}
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-admin:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${ADMIN_PORT}:3000"
    depends_on:
      - gateway

  tourism:
    image: ghcr.io/${IMAGE_OWNER}/ermekten-tourism:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${CLIENT_PORT}:3000"
    depends_on:
      - gateway

volumes:
  postgres_data:
  uploads_data:
