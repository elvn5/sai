services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parcel_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-parcel_bot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parcel_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      UPLOADS_DIR: /repo/apps/api/uploads
    # Internal only — the gateway owns the public API port and proxies
    # every endpoint not yet migrated to a Go service here.
    volumes:
      - uploads_data:/repo/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy

  media:
    build:
      context: .
      dockerfile: services/media/Dockerfile
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      UPLOADS_DIR: /data/uploads
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    # Same volume as the NestJS API: existing files stay where they are.
    volumes:
      - uploads_data:/data/uploads

  content:
    build:
      context: .
      dockerfile: services/content/Dockerfile
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-parcel_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      CONTENT_DB_NAME: content
      # One-time copy of existing content from the NestJS database on first start.
      LEGACY_DB_NAME: ${POSTGRES_DB:-parcel_bot}
      MEDIA_GRPC_ADDR: media:9081
    depends_on:
      postgres:
        condition: service_healthy
      media:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    restart: unless-stopped
    environment:
      LEGACY_API_URL: http://api:3001
      MEDIA_URL: http://media:8081
      CONTENT_URL: http://content:8082
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:3000}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3002}
    ports:
      - "${API_PORT:-3001}:8080"
    depends_on:
      - api
      - media
      - content

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MINI_APP_URL: ${MINI_APP_URL:-http://localhost:3002}
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    depends_on:
      - gateway

  tourism:
    build:
      context: .
      dockerfile: apps/tourism/Dockerfile
      args:
        NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3002}
        NUXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NUXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}
    restart: unless-stopped
    env_file: .env
    ports:
      - "${CLIENT_PORT:-3002}:3000"
    depends_on:
      - gateway

volumes:
  postgres_data:
  uploads_data:
