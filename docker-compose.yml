services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-parcel_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-parcel_bot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-parcel_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  users:
    build:
      context: .
      dockerfile: services/users/Dockerfile
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      COOKIE_SECURE: "false"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      BOT_TOKEN: ${BOT_TOKEN}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Ermekten <onboarding@resend.dev>}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-parcel_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      USERS_DB_NAME: users
      # One-time copy of accounts and support contacts from the NestJS database on first start.
      LEGACY_DB_NAME: ${POSTGRES_DB:-parcel_bot}
    depends_on:
      postgres:
        condition: service_healthy

  media:
    build:
      context: .
      dockerfile: services/media/Dockerfile
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      UPLOADS_DIR: /data/uploads
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      USERS_GRPC_ADDR: users:9083
    # Same volume as the NestJS API: existing files stay where they are.
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      - users

  content:
    build:
      context: .
      dockerfile: services/content/Dockerfile
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-parcel_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      CONTENT_DB_NAME: content
      # One-time copy of existing content from the NestJS database on first start.
      LEGACY_DB_NAME: ${POSTGRES_DB:-parcel_bot}
      MEDIA_GRPC_ADDR: media:9081
      USERS_GRPC_ADDR: users:9083
    depends_on:
      postgres:
        condition: service_healthy
      media:
        condition: service_started
      users:
        condition: service_started

  listings:
    build:
      context: .
      dockerfile: services/listings/Dockerfile
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-parcel_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      LISTINGS_DB_NAME: listings
      # One-time copy of existing listings from the NestJS database on first start.
      LEGACY_DB_NAME: ${POSTGRES_DB:-parcel_bot}
      USERS_GRPC_ADDR: users:9083
      BOT_TOKEN: ${BOT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      users:
        condition: service_started

  trails:
    build:
      context: .
      dockerfile: services/trails/Dockerfile
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-parcel_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      TRAILS_DB_NAME: trails
      USERS_GRPC_ADDR: users:9083
    depends_on:
      postgres:
        condition: service_healthy
      users:
        condition: service_started

  payments:
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-parcel_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      PAYMENTS_DB_NAME: payments
      USERS_GRPC_ADDR: users:9083
      LISTINGS_GRPC_ADDR: listings:9082
      # "fake" (test page) until Bakai access is set up, then "bakai".
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-fake}
      BAKAI_LOGIN: ${BAKAI_LOGIN:-}
      BAKAI_PASSWORD: ${BAKAI_PASSWORD:-}
      BAKAI_QR_TYPE: ${BAKAI_QR_TYPE:-}
      PLATFORM_FEE_PERCENT: ${PLATFORM_FEE_PERCENT:-0}
      SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3002}
      BOT_TOKEN: ${BOT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      users:
        condition: service_started
      listings:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    restart: unless-stopped
    environment:
      MEDIA_URL: http://media:8081
      CONTENT_URL: http://content:8082
      LISTINGS_URL: http://listings:8083
      USERS_URL: http://users:8084
      TRAILS_URL: http://trails:8085
      PAYMENTS_URL: http://payments:8086
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:3000}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3002}
      EXTRA_ORIGINS: ${EXTRA_ORIGINS:-http://localhost:3012,http://localhost:3013}
    ports:
      - "${API_PORT:-3001}:8080"
    depends_on:
      - media
      - content
      - listings
      - users
      - trails
      - payments

  bot:
    build:
      context: .
      dockerfile: services/bot/Dockerfile
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      MINI_APP_URL: ${MINI_APP_URL:-http://localhost:3002}
      # Accounts and support contacts come from the users service.
      USERS_GRPC_ADDR: users:9083
      # Tours and the blog: the gateway, called on users' behalf
      # with sessions signed with JWT_SECRET.
      API_URL: http://gateway:8080
      JWT_SECRET: ${JWT_SECRET}
      # Cover pictures Telegram fetches itself.
      PUBLIC_API_URL: ${PUBLIC_API_BASE_URL:-http://localhost:3001}
      # Its own database: blog subscribers.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-parcel_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      BOT_DB_NAME: bot
      # Analytics (GA4 Measurement Protocol); unset — off.
      FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID:-}
      GA_API_SECRET: ${GA_API_SECRET:-}
      ANALYTICS_SALT: ${ANALYTICS_SALT:-}
    depends_on:
      postgres:
        condition: service_healthy
      users:
        condition: service_started
      gateway:
        condition: service_started

  # The public site (SSR) and the admin panel. Settings are read at start,
  # so one image serves every environment.
  site:
    build:
      context: .
      dockerfile: apps/site/Dockerfile
    restart: unless-stopped
    environment:
      API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:3001}
      # Server-side rendering calls the gateway over the Docker network.
      API_INTERNAL_URL: http://gateway:8080
      SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3002}
      TELEGRAM_BOT_USERNAME: ${PUBLIC_TELEGRAM_BOT_USERNAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      # SHA-256 (hex) of the developer menu password; unset — no menu.
      DEV_MENU_PASSWORD_HASH: ${DEV_MENU_PASSWORD_HASH:-}
      # Firebase Analytics in the browser; unset — off.
      FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_WEB_APP_ID: ${FIREBASE_WEB_APP_ID:-}
      FIREBASE_MEASUREMENT_ID: ${FIREBASE_MEASUREMENT_ID:-}
    ports:
      - "${CLIENT_PORT:-3002}:3000"
    depends_on:
      - gateway

  panel:
    build:
      context: .
      dockerfile: apps/panel/Dockerfile
    restart: unless-stopped
    environment:
      API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:3001}
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    depends_on:
      - gateway

volumes:
  postgres_data:
  uploads_data:
