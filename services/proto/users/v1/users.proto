syntax = "proto3";

package users.v1;

option go_package = "github.com/elvn5/sai/services/proto/gen/go/users/v1;usersv1";

// Internal API of the users service, for other backend services.
service UsersService {
  // Looks up one user. NOT_FOUND if there is no such user.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // Looks up several users at once; unknown ids are simply left out.
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
  // Telegram chat ids for sending notifications; users without a linked
  // Telegram account are left out.
  rpc GetTelegramChats(GetTelegramChatsRequest) returns (GetTelegramChatsResponse);

  // For the Telegram bot.

  // Finds the account for a Telegram user, creating it on first contact,
  // and refreshes the profile fields that were provided.
  rpc UpsertTelegramUser(UpsertTelegramUserRequest) returns (UpsertTelegramUserResponse);
  // Completes a phone registration started on the website: the site hands
  // the user a t.me deep link carrying this token. NOT_FOUND if the token is
  // unknown, expired or the account is already verified.
  rpc ConfirmTelegramVerification(ConfirmTelegramVerificationRequest) returns (ConfirmTelegramVerificationResponse);
  // Updates fields edited from the bot. ALREADY_EXISTS if the phone number
  // belongs to another account.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // Support contacts shown by the bot (edited in the admin panel).
  rpc GetSupportInfo(GetSupportInfoRequest) returns (GetSupportInfoResponse);
}

enum PartnerStatus {
  PARTNER_STATUS_UNSPECIFIED = 0;
  PARTNER_STATUS_NONE = 1;
  PARTNER_STATUS_PENDING = 2;
  PARTNER_STATUS_APPROVED = 3;
  PARTNER_STATUS_REJECTED = 4;
}

// The public profile of a user plus what other services need for
// authorization. Contact details (email, phone) are deliberately absent.
message User {
  string id = 1;
  optional string first_name = 2;
  optional string username = 3;
  optional string avatar_url = 4;
  PartnerStatus partner_status = 5;
}

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  User user = 1;
}

message GetUsersRequest {
  repeated string ids = 1;
}

message GetUsersResponse {
  repeated User users = 1;
}

message GetTelegramChatsRequest {
  repeated string user_ids = 1;
}

message GetTelegramChatsResponse {
  // user id → Telegram chat id (for a private chat, the Telegram user id).
  map<string, int64> chat_ids = 1;
}

// What the bot shows a user about their own account.
message TelegramAccount {
  string id = 1;
  optional string first_name = 2;
  optional string username = 3;
  optional string phone = 4;
}

message UpsertTelegramUserRequest {
  string telegram_id = 1;
  optional string username = 2;
  optional string first_name = 3;
  optional string last_name = 4;
}

message UpsertTelegramUserResponse {
  TelegramAccount account = 1;
}

message ConfirmTelegramVerificationRequest {
  string token = 1;
}

message ConfirmTelegramVerificationResponse {
  TelegramAccount account = 1;
}

message UpdateProfileRequest {
  string user_id = 1;
  optional string first_name = 2;
  optional string phone = 3;
}

message UpdateProfileResponse {
  TelegramAccount account = 1;
}

message GetSupportInfoRequest {}

message GetSupportInfoResponse {
  SupportInfo support = 1;
}

message SupportInfo {
  string message = 1;
  optional string phone = 2;
  optional string telegram_contact = 3;
  optional string email = 4;
  optional string working_hours = 5;
}
