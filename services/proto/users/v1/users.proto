syntax = "proto3";

package users.v1;

option go_package = "github.com/elvn5/sai/services/proto/gen/go/users/v1;usersv1";

// Internal API of the users service, for other backend services.
service UsersService {
  // Looks up one user. NOT_FOUND if there is no such user.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // Looks up several users at once; unknown ids are simply left out.
  rpc GetUsers(GetUsersRequest) returns (GetUsersResponse);
  // Telegram chat ids for sending notifications; users without a linked
  // Telegram account are left out.
  rpc GetTelegramChats(GetTelegramChatsRequest) returns (GetTelegramChatsResponse);

  // For the Telegram bot.

  // Finds the account for a Telegram user, creating it on first contact,
  // and refreshes the profile fields that were provided.
  rpc UpsertTelegramUser(UpsertTelegramUserRequest) returns (UpsertTelegramUserResponse);
  // Completes a phone registration started on the website: the site hands
  // the user a t.me deep link carrying this token. NOT_FOUND if the token is
  // unknown, expired or the account is already verified.
  rpc ConfirmTelegramVerification(ConfirmTelegramVerificationRequest) returns (ConfirmTelegramVerificationResponse);
  // Links a Telegram account to the site account that requested a link
  // token (/start link_<token>). NOT_FOUND: unknown or expired token.
  // ALREADY_EXISTS: the Telegram id belongs to another account that has its
  // own sign-in (email, phone or password). FAILED_PRECONDITION: it belongs
  // to a Telegram-only account; repeat with move_from_other_account to
  // merge that account into the site account (account_merges).
  rpc LinkTelegram(LinkTelegramRequest) returns (LinkTelegramResponse);
  // Updates fields edited from the bot. ALREADY_EXISTS if the phone number
  // belongs to another account.
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  // Support contacts shown by the bot (edited in the admin panel).
  rpc GetSupportInfo(GetSupportInfoRequest) returns (GetSupportInfoResponse);
  // Keeps the language a Telegram chat reads the bot in (picked in the bot,
  // or taken from the user's Telegram app on first contact), so the other
  // services' notifications come in it. Keyed by Telegram id: it may
  // arrive before the account exists and follows the id when it moves.
  rpc SetTelegramLanguage(SetTelegramLanguageRequest) returns (SetTelegramLanguageResponse);
  // Confirms a phone number the Telegram user shared from the bot (their
  // own contact, so Telegram vouches for it). If another account has that
  // number, a Telegram-only account is merged into it (merged is set).
  // NOT_FOUND: no account with this Telegram id. ALREADY_EXISTS: the number
  // belongs to another account and the two can't be merged.
  rpc ConfirmTelegramPhone(ConfirmTelegramPhoneRequest) returns (ConfirmTelegramPhoneResponse);

  // For every service.

  // The accounts merged into others after after_id, oldest first: each
  // service moves what the first owned onto the second.
  rpc ListAccountMerges(ListAccountMergesRequest) returns (ListAccountMergesResponse);
}

message ConfirmTelegramPhoneRequest {
  string telegram_id = 1;
  string phone = 2;
}

message ConfirmTelegramPhoneResponse {
  TelegramAccount account = 1;
  bool merged = 2;
}

message ListAccountMergesRequest {
  int64 after_id = 1;
  // At most this many (100 when 0).
  int32 limit = 2;
}

message AccountMerge {
  int64 id = 1;
  string from_user_id = 2;
  string to_user_id = 3;
}

message ListAccountMergesResponse {
  repeated AccountMerge merges = 1;
}

enum PartnerStatus {
  PARTNER_STATUS_UNSPECIFIED = 0;
  PARTNER_STATUS_NONE = 1;
  PARTNER_STATUS_PENDING = 2;
  PARTNER_STATUS_APPROVED = 3;
  PARTNER_STATUS_REJECTED = 4;
}

// The public profile of a user plus what other services need for
// authorization. Contact details (email, phone) are deliberately absent.
message User {
  string id = 1;
  optional string first_name = 2;
  optional string username = 3;
  optional string avatar_url = 4;
  PartnerStatus partner_status = 5;
  // Sessions issued before this (unix seconds) are no longer valid: the
  // password was reset then. 0 when there's no such cut-off.
  int64 sessions_valid_after = 6;
  // "organizer" (runs tours) or "driver" (carries tour groups).
  string partner_kind = 7;
}

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  User user = 1;
}

message GetUsersRequest {
  repeated string ids = 1;
}

message GetUsersResponse {
  repeated User users = 1;
}

message GetTelegramChatsRequest {
  repeated string user_ids = 1;
}

message GetTelegramChatsResponse {
  // user id → Telegram chat id (for a private chat, the Telegram user id).
  map<string, int64> chat_ids = 1;
  // user id → the chat's language ("ru", "ky", "en", "de"); absent when the
  // bot hasn't told it yet (write in Russian then).
  map<string, string> languages = 2;
}

message SetTelegramLanguageRequest {
  string telegram_id = 1;
  // "ru", "ky", "en" or "de"; anything else is INVALID_ARGUMENT.
  string language = 2;
}

message SetTelegramLanguageResponse {}

// What the bot shows a user about their own account.
message TelegramAccount {
  string id = 1;
  optional string first_name = 2;
  optional string username = 3;
  optional string phone = 4;
  // Whether the account has an email (it's never sent).
  bool has_email = 5;
}

message LinkTelegramRequest {
  string token = 1;
  string telegram_id = 2;
  optional string username = 3;
  bool move_from_other_account = 4;
}

message LinkTelegramResponse {
  TelegramAccount account = 1;
}

message UpsertTelegramUserRequest {
  string telegram_id = 1;
  optional string username = 2;
  optional string first_name = 3;
  optional string last_name = 4;
}

message UpsertTelegramUserResponse {
  TelegramAccount account = 1;
}

message ConfirmTelegramVerificationRequest {
  string token = 1;
}

message ConfirmTelegramVerificationResponse {
  TelegramAccount account = 1;
}

message UpdateProfileRequest {
  string user_id = 1;
  optional string first_name = 2;
  optional string phone = 3;
}

message UpdateProfileResponse {
  TelegramAccount account = 1;
}

message GetSupportInfoRequest {}

message GetSupportInfoResponse {
  SupportInfo support = 1;
}

message SupportInfo {
  string message = 1;
  optional string phone = 2;
  optional string telegram_contact = 3;
  optional string email = 4;
  optional string working_hours = 5;
}
